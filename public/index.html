<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Pós-Mestrado Pro</title>
    <style>
        :root {
            --bg-main: #0b0f17;
            --bg-card: #121b2d;
            --bg-card-hover: #162237;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #10b981;
            --primary-hover: #059669;
            --secondary: #3b82f6;
            --danger: #f87171;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

        body { background-color: var(--bg-main); color: var(--text-main); padding: 2rem; }

        header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #10b981, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-box { display: flex; align-items: center; gap: 0.75rem; }
        .user-box span { color: var(--text-muted); font-size: 0.85rem; }

        .action-bar {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 1.2rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .controls-group { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }

        input {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            outline: none;
        }

        input:focus { border-color: var(--primary); }

        #buscaNome { width: 280px; }

        button {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 0.6rem 1.3rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
            transition: all 0.2s ease;
        }

        button:hover { transform: translateY(-1px); box-shadow: 0 6px 15px rgba(16, 185, 129, 0.4); }
        button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            box-shadow: none;
        }
        .btn-outline:hover { background: #1e293b; color: #fff; box-shadow: none; border-color: #334155; }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.3rem 1.5rem;
        }

        .card span { color: var(--text-muted); font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .card h2 { font-size: 1.8rem; margin-top: 0.3rem; font-weight: 800; }
        .card h2.json-count { color: var(--primary); }
        .card h2.html-count { color: var(--secondary); }

        .turma-section { margin-bottom: 2rem; }

        .turma-header {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 0.7rem 1.2rem;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid var(--border);
            border-radius: 8px 8px 0 0;
            border-bottom: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .turma-header .count { font-size: 0.8rem; font-weight: 500; color: #64748b; }

        table { width: 100%; border-collapse: collapse; background: var(--bg-card); text-align: left; }
        th, td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        th { background-color: #162032; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
        tr:last-child td { border-bottom: none; }
        .turma-section:last-child table tr:last-child td { border-radius: 0 0 8px 8px; }
        .turma-section:last-child .turma-header + table { border-radius: 0 0 8px 8px; overflow: hidden; }
        tr:hover { background-color: var(--bg-card-hover); }

        .badge { padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.7rem; font-weight: 700; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
        .badge-lattes { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.25); }
        .badge-escavador { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.25); }
        .badge-none { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.15); }

        .defesa-label { font-family: monospace; font-size: 0.8rem; }
        .defesa-em-andamento { color: #f59e0b; font-weight: 600; }
        .defesa-concluida { color: var(--text-muted); }

        .nome-aluno { color: #fff; }

        .resumo-cell { line-height: 1.5; color: #cbd5e1; font-size: 0.85rem; white-space: pre-line; }
        .resumo-placeholder { color: #475569; font-style: italic; }
        .resumo-label { font-size: 0.7rem; color: #64748b; display: block; margin-bottom: 4px; }

        .filter-bar { display: flex; gap: 0.5rem; align-items: center; }
        .filter-bar label { color: var(--text-muted); font-size: 0.8rem; }

        select {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
        }
        select:focus { border-color: var(--primary); }

        .vazio { text-align: center; color: var(--text-muted); padding: 3rem; font-style: italic; }

        #toast {
            position: fixed;
            right: 1.5rem;
            bottom: 1.5rem;
            max-width: 380px;
            background: #162032;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            padding: 0.9rem 1.1rem;
            color: var(--text-main);
            font-size: 0.85rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: none;
            z-index: 50;
        }
        #toast.erro { border-left-color: var(--danger); }
        #toast.visivel { display: block; }
    </style>
</head>
<body>

    <header>
        <h1>Scanner de Atividades Pós-Mestrado</h1>
        <div class="user-box">
            <span id="usuarioAtual"></span>
            <button id="btnLogout" class="btn-outline" type="button">Sair</button>
        </div>
    </header>

    <div class="action-bar">
        <div class="controls-group">
            <input type="text" id="buscaNome" placeholder="Buscar aluno..." autocomplete="off">
            <div class="filter-bar">
                <label for="filtroOrigem">Fonte:</label>
                <select id="filtroOrigem">
                    <option value="todas">Todas</option>
                    <option value="json">JSON (Lattes)</option>
                    <option value="html">HTML (Escavador)</option>
                    <option value="none">Nenhuma</option>
                </select>
            </div>
            <div class="filter-bar">
                <label for="filtroTurma">Turma:</label>
                <select id="filtroTurma">
                    <option value="todas">Todas</option>
                </select>
            </div>
        </div>
        <div class="controls-group">
            <button id="btnRecarregar" class="btn-outline" type="button">Recarregar resumos (cache)</button>
            <button id="btnAtualizarLattes" class="btn-outline" type="button">Atualizar JSONs (Lattes)</button>
            <button id="btnAtualizarEscavador" class="btn-outline" type="button">Atualizar HTMLs (Escavador)</button>
        </div>
    </div>

    <div class="dashboard-grid">
        <div class="card"><span>Alunos</span><h2 id="totalAlunos" style="color:#f8fafc;">-</h2></div>
        <div class="card"><span>Dados Lattes (JSON)</span><h2 id="totalJson" class="json-count">-</h2></div>
        <div class="card"><span>Dados Escavador (HTML)</span><h2 id="totalHtml" class="html-count">-</h2></div>
        <div class="card"><span>Sem Dados</span><h2 id="totalNone" style="color:#f87171;">-</h2></div>
    </div>

    <div id="tabelaContainer"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="/assets/app.js"></script>
</body>
</html>
