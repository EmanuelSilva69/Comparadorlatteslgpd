services:
  app:
    build: .
    container_name: scanner-pos-mestrado
    # Só o reverse proxy local (nginx/Traefik) alcança a aplicação.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - APP_AMBIENTE=producao
      - APP_DATA_DIR=/app/dados
      # Coleta desabilitada no container (não há Chrome/scriptLattes aqui).
      # Para liberar, remova esta linha e garanta as dependências de coleta.
      - APP_PERMITIR_ATUALIZACAO=0
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./dados:/app/dados:ro
    restart: unless-stopped

# Deploy sem LLM/GPU: nenhum serviço de inferência é executado.
# A aplicação só lê dados; a coleta roda fora do servidor.
